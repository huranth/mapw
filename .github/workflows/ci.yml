name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            software/package-lock.json
            website/package-lock.json
      - name: Install software
        working-directory: software
        run: npm ci
      - name: Typecheck
        working-directory: software
        run: npm run typecheck
      - name: Tests
        working-directory: software
        run: npm test
      - name: Build website
        working-directory: website
        env:
          VITE_SUPABASE_URL: https://pdynfowdtiulrllqetbl.supabase.co
        run: |
          npm ci
          npm run build
          test -d dist || (echo "dist missing" && exit 1)
